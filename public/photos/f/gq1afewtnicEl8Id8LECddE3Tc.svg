y="360" fill="#777" font-size="14" font-weight="700">04 · VOICE</text><text x="508" y="393" fill="#1f1f1f" font-size="23" font-weight="700">ElevenLabs</text><text x="508" y="425" fill="#444" font-size="18.5">Spoken sentence by</text><text x="508" y="451" fill="#444" font-size="18.5">sentence in English</text><text x="508" y="477" fill="#444" font-size="18.5">or Japanese</text><rect width="210" height="180" x="246" y="330" fill="#1f1f1f" rx="16"/><text x="263" y="360" fill="#bbb" font-size="14" font-weight="700">05 · CHARACTER</text><text x="263" y="393" fill="#fff" font-size="23" font-weight="700">VRoid model</text><text x="263" y="425" fill="#e6e6e6" font-size="18.5">3D character shown</text><text x="263" y="451" fill="#e6e6e6" font-size="18.5">and animated with</text><text x="263" y="477" fill="#e6e6e6" font-size="18.5">three.js</text><rect width="210" height="180" x="1" y="330" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="18" y="360" fill="#777" font-size="14" font-weight="700">06 · REWARDS</text><text x="18" y="393" fill="#1f1f1f" font-size="23" font-weight="700">Petals</text><text x="18" y="425" fill="#444" font-size="18.5">Focus and quests earn</text><text x="18" y="451" fill="#444" font-size="18.5">petals for characters,</text><text x="18" y="477" fill="#444" font-size="18.5">outfits, backgrounds</text><g fill="none" stroke="#fff" stroke-linejoin="round" stroke-width="2.6" marker-end="url(#a)"><path d="M213 120h30"/><path d="M458 120h30"/><path d="M596 212v114"/><path d="M489 420h-30"/><path d="M244 420h-30"/></g><text x="586" y="274" fill="#fff" font-size="16" font-weight="700" text-anchor="end">reply text</text><rect width="18" height="18" x="2" y="556" fill="#1f1f1f" rx="4"/><text x="30" y="571" fill="#fff" font-size="16">My parts: the backend and the 3D character models</text></svg>