<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 -30 702 600"><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#fff" d="m0 0 10 5-10 5Z"/></marker></defs><text x="2" y="14" fill="#fff" font-size="14" font-weight="700" letter-spacing="1.4">DIGITAL ALARM CLOCK · SYSTEM FLOW</text><rect width="210" height="180" x="1" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="18" y="60" fill="#777" font-size="14" font-weight="700">01 · CLOCK</text><text x="18" y="93" fill="#1f1f1f" font-size="23" font-weight="700">Prescale</text><text x="18" y="125" fill="#444" font-size="18.5">50 MHz clock ÷ a</text><text x="18" y="151" fill="#444" font-size="18.5">25-bit counter</text><text x="18" y="177" fill="#444" font-size="18.5">→ ≈1 Hz tick</text><rect width="210" height="180" x="246" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="263" y="60" fill="#777" font-size="14" font-weight="700">02 · INPUT</text><text x="263" y="93" fill="#1f1f1f" font-size="23" font-weight="700">Pulse generate</text><text x="263" y="125" fill="#444" font-size="18.5">Turns each key</text><text x="263" y="151" fill="#444" font-size="18.5">press into one</text><text x="263" y="177" fill="#444" font-size="18.5">clean pulse</text><rect width="210" height="180" x="491" y="30" fill="#1f1f1f" rx="16"/><text x="508" y="60" fill="#bbb" font-size="14" font-weight="700">03 · CONTROL</text><text x="508" y="93" fill="#fff" font-size="23" font-weight="700">Mode FSM</text><text x="508" y="125" fill="#e6e6e6" font-size="18.5">SW1 / SW0 pick</text><text x="508" y="151" fill="#e6e6e6" font-size="18.5">Running, Set time</text><text x="508" y="177" fill="#e6e6e6" font-size="18.5">or Alarm set</text><rect width="210" height="180" x="1" y="330" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="18" y="360" fill="#777" font-size="14" font-weight="700">04 · COUNT</text><text x="18" y="393" fill="#1f1f1f" font-size="23" font-weight="700">Running clock</text><text x="18" y="425" fill="#444" font-size="18.5">BCD counters</text><text x="18" y="451" fill="#444" font-size="18.5">0–59, 0–59, 0–23</text><text x="18" y="477" fill="#444" font-size="18.5">per-field hold / inc</text><rect width="210" height="180" x="246" y="330" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="263" y="360" fill="#777" font-size="14" font-weight="700">05 · DISPLAY</text><text x="263" y="393" fill="#1f1f1f" font-size="23" font-weight="700">7-segment</text><text x="263" y="425" fill="#444" font-size="18.5">Decoders drive</text><text x="263" y="451" fill="#444" font-size="18.5">six HEX displays</text><text x="263" y="477" fill="#444" font-size="18.5">as HH:MM:SS</text><rect width="210" height="180" x="491" y="330" fill="#fff" stroke="#1f1f1f" stroke-dasharray="7 6" stroke-width="2.2" rx="16"/><text x="508" y="360" fill="#777" font-size="14" font-weight="700">06 · ALARM</text><text x="508" y="393" fill="#1f1f1f" font-size="23" font-weight="700">Alarm</text><text x="508" y="425" fill="#444" font-size="18.5">Stores a set time;</text><text x="508" y="451" fill="#444" font-size="18.5">if armed + matched,</text><text x="508" y="477" fill="#444" font-size="18.5">the LEDs light up</text><g fill="none" stroke="#fff" stroke-linejoin="round" stroke-width="2.6" marker-end="url(#a)"><path d="M213 120h30"/><path d="M458 120h30"/><path d="M540 212v56H106v58"/><path d="M650 212v114"/><path d="M213 420h30"/><path d="M106 512v33h490v-31"/></g><text x="323" y="258" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">running / set time</text><text x="640" y="300" fill="#fff" font-size="16" font-weight="700" text-anchor="end">alarm set</text><text x="351" y="536" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">current time compared</text></svg>