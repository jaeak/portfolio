<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 -28 702 492"><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#fff" d="m0 0 10 5-10 5Z"/></marker></defs><text x="2" y="16" fill="#fff" font-size="13" font-weight="700" letter-spacing="1.4">BLUEBERRY SORTER · SYSTEM FLOW</text><rect width="210" height="160" x="1" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2" rx="16"/><text x="18" y="58" fill="#777" font-size="13" font-weight="600">01 · INPUT</text><text x="18" y="88" fill="#1f1f1f" font-size="20" font-weight="700">Funnel</text><text x="18" y="116" fill="#555" font-size="16">Wide, curved funnel</text><text x="18" y="138" fill="#555" font-size="16">slows berries before</text><text x="18" y="160" fill="#555" font-size="16">they reach the disc</text><rect width="210" height="160" x="246" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2" rx="16"/><text x="263" y="58" fill="#777" font-size="13" font-weight="600">02 · FEED</text><text x="263" y="88" fill="#1f1f1f" font-size="20" font-weight="700">Centrifugal disc</text><text x="263" y="116" fill="#555" font-size="16">12V DC motor</text><text x="263" y="138" fill="#555" font-size="16">200 RPM · 0.44 N·m</text><text x="263" y="160" fill="#555" font-size="16">L298 motor driver</text><rect width="210" height="160" x="491" y="30" fill="#1f1f1f" rx="16"/><text x="508" y="58" fill="#bbb" font-size="13" font-weight="600">03 · DETECT</text><text x="508" y="88" fill="#fff" font-size="20" font-weight="700">Color check</text><text x="508" y="116" fill="#ddd" font-size="16">TCS3200 reads RGB</text><text x="508" y="138" fill="#ddd" font-size="16">within 10 mm, tests</text><text x="508" y="160" fill="#ddd" font-size="16">the blueberry range</text><rect width="210" height="160" x="1" y="300" fill="#fff" stroke="#1f1f1f" stroke-width="2" rx="16"/><text x="18" y="328" fill="#777" font-size="13" font-weight="600">04 · SIZE</text><text x="18" y="358" fill="#1f1f1f" font-size="20" font-weight="700">Size slots</text><text x="18" y="386" fill="#555" font-size="16">Small: 8 × 10 mm</text><text x="18" y="408" fill="#555" font-size="16">Large: 18 × 20 mm</text><text x="18" y="430" fill="#555" font-size="16">on a ¼-circle branch</text><rect width="210" height="160" x="246" y="300" fill="#fff" stroke="#1f1f1f" stroke-width="2" rx="16"/><text x="263" y="328" fill="#777" font-size="13" font-weight="600">05 · OUTPUT</text><text x="263" y="358" fill="#1f1f1f" font-size="20" font-weight="700">Collected</text><text x="263" y="386" fill="#555" font-size="16">3 cm tunnels guide</text><text x="263" y="408" fill="#555" font-size="16">accepted berries</text><text x="263" y="430" fill="#555" font-size="16">to the exit</text><rect width="210" height="160" x="491" y="300" fill="#fff" stroke="#1f1f1f" stroke-dasharray="6 6" stroke-width="2" rx="16"/><text x="508" y="328" fill="#777" font-size="13" font-weight="600">REJECT</text><text x="508" y="358" fill="#1f1f1f" font-size="20" font-weight="700">SG90 servo flap</text><text x="508" y="386" fill="#555" font-size="16">Sweeps 30° to divert</text><text x="508" y="408" fill="#555" font-size="16">the object into a</text><text x="508" y="430" fill="#555" font-size="16">pull-out reject tray</text><g fill="none" stroke="#fff" stroke-linejoin="round" stroke-width="2.5" marker-end="url(#a)"><path d="M213 110h30"/><path d="M458 110h30"/><path d="M540 192v53H106v51"/><path d="M650 192v104"/><path d="M213 380h30"/></g><text x="323" y="236" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">in range</text><text x="640" y="278" fill="#fff" font-size="14" font-weight="600" text-anchor="end">out of range</text></svg>