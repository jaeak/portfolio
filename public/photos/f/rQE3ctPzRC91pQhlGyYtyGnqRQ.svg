<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif" viewBox="0 -30 702 600"><defs><marker id="a" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#fff" d="m0 0 10 5-10 5Z"/></marker></defs><text x="2" y="14" fill="#777" font-size="14" font-weight="700" letter-spacing="1.4">AI POSTURE DETECTION · PIPELINE</text><rect width="210" height="180" x="1" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="18" y="60" fill="#777" font-size="14" font-weight="700">01 · DATA</text><text x="18" y="93" fill="#1f1f1f" font-size="23" font-weight="700">Collect</text><text x="18" y="125" fill="#444" font-size="18.5">Good &amp; poor posture</text><text x="18" y="151" fill="#444" font-size="18.5">images labelled in</text><text x="18" y="177" fill="#444" font-size="18.5">Teachable Machine</text><rect width="210" height="180" x="246" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="263" y="60" fill="#777" font-size="14" font-weight="700">02 · LANDMARKS</text><text x="263" y="93" fill="#1f1f1f" font-size="23" font-weight="700">MediaPipe</text><text x="263" y="125" fill="#444" font-size="18.5">Tracks 33 body and</text><text x="263" y="151" fill="#444" font-size="18.5">468 face points</text><text x="263" y="177" fill="#444" font-size="18.5">every frame</text><rect width="210" height="180" x="491" y="30" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="508" y="60" fill="#777" font-size="14" font-weight="700">03 · DATASET</text><text x="508" y="93" fill="#1f1f1f" font-size="23" font-weight="700">CSV export</text><text x="508" y="125" fill="#444" font-size="18.5">x, y, z, visibility</text><text x="508" y="151" fill="#444" font-size="18.5">per point, saved</text><text x="508" y="177" fill="#444" font-size="18.5">with its class</text><rect width="210" height="180" x="1" y="330" fill="#1f1f1f" rx="16"/><text x="18" y="360" fill="#bbb" font-size="14" font-weight="700">04 · TRAIN</text><text x="18" y="393" fill="#fff" font-size="23" font-weight="700">4 classifiers</text><text x="18" y="425" fill="#e6e6e6" font-size="18.5">scikit-learn models</text><text x="18" y="451" fill="#e6e6e6" font-size="18.5">in Jupyter, compared</text><text x="18" y="477" fill="#e6e6e6" font-size="18.5">over two trials</text><rect width="210" height="180" x="246" y="330" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="263" y="360" fill="#777" font-size="14" font-weight="700">05 · DETECT</text><text x="263" y="393" fill="#1f1f1f" font-size="23" font-weight="700">Live webcam</text><text x="263" y="425" fill="#444" font-size="18.5">OpenCV feeds each</text><text x="263" y="451" fill="#444" font-size="18.5">frame to the model</text><text x="263" y="477" fill="#444" font-size="18.5">in real time</text><rect width="210" height="180" x="491" y="330" fill="#fff" stroke="#1f1f1f" stroke-width="2.2" rx="16"/><text x="508" y="360" fill="#777" font-size="14" font-weight="700">06 · ALERT</text><text x="508" y="393" fill="#1f1f1f" font-size="23" font-weight="700">On-screen</text><text x="508" y="425" fill="#444" font-size="18.5">Shows Good or Poor</text><text x="508" y="451" fill="#444" font-size="18.5">posture with the</text><text x="508" y="477" fill="#444" font-size="18.5">model&apos;s confidence</text><g fill="none" stroke="#fff" stroke-linejoin="round" stroke-width="2.6" marker-end="url(#a)"><path d="M213 120h30"/><path d="M458 120h30"/><path d="M596 212v56H106v58"/><path d="M213 420h30"/><path d="M458 420h30"/></g><text x="351" y="258" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">labelled coordinates</text></svg>