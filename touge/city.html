<!doctype html><html><head><meta name=viewport content="width=device-width,initial-scale=1"><link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=Inter:wght@400;600;700&display=swap"><style>
body{margin:0;font-family:Inter,sans-serif;color:#EEF2FF;background:#07080c}

h2{font:800 40px/1 Inter;margin:0 0 10px}</style></head><body><div id=bg></div><div id=tint></div><div id=dk></div><canvas id=lc></canvas><div class=w><h1>Hello, I&#39;m Jack</h1><p>Systems Engineering student at Simon Fraser University.</p>

<script src="/lights.js"></script><script>startLights(document.getElementById("lc"));
const dk=document.getElementById("dk");let D=0;(function f(){requestAnimationFrame(f);const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);const pp=Math.min(1,scrollY/max/.87);const tg=1-(1-pp)*(1-pp);D+=(tg-D)*.08;dk.style.opacity=(D*.5).toFixed(3)})();</script></body></html>
