<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>O vs W</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Pixelify+Sans:wght@700&display=swap" />
<style>
  body { margin: 0; background: #08090c; color: #e9edf3; font: 16px/1.6 Inter, system-ui, sans-serif; }
  .hero { position: relative; height: 100vh; min-height: 560px; overflow: hidden; display: flex; align-items: center; padding: 0 8vw; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(8, 9, 12, 0.88) 0%, rgba(8, 9, 12, 0.55) 45%, rgba(8, 9, 12, 0.2) 100%), linear-gradient(transparent 60%, #08090c); }
  .copy { position: relative; z-index: 1; max-width: 560px; }
  .tag { position: absolute; z-index: 1; top: 20px; right: 24px; font: 700 28px var(--x, "Pixelify Sans"); color: #fff; opacity: 0.85; }
  h1 { margin: 0 0 12px; font: 700 clamp(44px, 7vw, 72px)/1.05 "Pixelify Sans", monospace; color: #fff; text-shadow: 0 0 18px rgba(0, 0, 0, 0.6); }
  p { margin: 0 0 22px; color: rgba(220, 228, 240, 0.85); }
  p strong { color: #fff; font-weight: 600; }
  .row { display: flex; gap: 10px; }
  .btn { padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.28); color: #f1f4f8; font-size: 14px; font-weight: 500; background: rgba(255, 255, 255, 0.06); backdrop-filter: blur(6px); }
  .btn.solid { background: #e9edf3; color: #0b0c10; border-color: #e9edf3; }
</style>
</head>
<body>
  <section class="hero">
    <img src="https://images.unsplash.com/photo-1774488979104-72ac80fac637?w=2000&q=75" alt="" />
    <div class="tag">O</div>
    <div class="copy">
      <h1>Hi, I’m Jack</h1>
      <p><strong>Systems Engineering</strong> @ Simon Fraser University<br />Embedded systems and firmware</p>
      <div class="row"><span class="btn solid">View projects</span><span class="btn">Resume</span></div>
    </div>
  </section>
  <section class="hero">
    <img src="https://images.unsplash.com/photo-1704226840161-5718a7894bf0?w=2000&q=75" alt="" />
    <div class="tag">W</div>
    <div class="copy">
      <h1>Hi, I’m Jack</h1>
      <p><strong>Systems Engineering</strong> @ Simon Fraser University<br />Embedded systems and firmware</p>
      <div class="row"><span class="btn solid">View projects</span><span class="btn">Resume</span></div>
    </div>
  </section>
</body>
</html>
